<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" as="image" href="assets/room.webp" fetchpriority="high"><title>Where is the bunny?</title><link rel="stylesheet" href="style.css?v=illustrated-3"></head>
<body><main>
