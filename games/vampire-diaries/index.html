<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Diaries</title><style>body{margin:0;background:#171316;color:#fff8f2;font:16px system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:20px}a{color:#dac8d1;text-decoration:none;font-weight:800}.box{background:#251f24;border:1px solid #493c44;border-radius:22px;padding:20px;margin:15px 0}button{border:1px solid #493c44;background:#332a30;color:#fff;padding:11px 14px;border-radius:14px;margin:4px;font-weight:800}.word{background:#7d2944}.name{font-size:30px;font-weight:900;text-align:center;padding:20px}.tags{display:flex;flex-wrap:wrap;gap:7px}</style></head><body><main><a href="../../">‹ All games</a><h1>🧛🏻‍♀️ The Vampire Diaries</h1><div class="box"><h2>Who am I?</h2><div id="name" class="name">••••••</div><button onclick="draw()">Draw a character</button><button onclick="name.textContent='••••••'">Hide</button><p>Ask: <b>Are you tall?</b> · <b>Do you have dark hair?</b> · <b>Are you kind?</b></p></div><div class="box"><h2>Describe a character</h2><div id="tags" class="tags"></div></div><script>const people=['Klaus','Caroline','Damon','Stefan','Elena','Bonnie'],w=['tall','short','slim','strong','blonde','dark-haired','long hair','short hair','straight hair','wavy hair','curly hair','blue eyes','brown eyes','kind','dangerous','funny','brave','smart','loyal','selfish','jealous','cruel','protective','romantic','mysterious'];function draw(){name.textContent=people[Math.floor(Math.random()*people.length)]}w.forEach(x=>{let b=document.createElement('button');b.className='word';b.textContent=x;b.onclick=()=>b.style.opacity=b.style.opacity==='.35'?'1':'.35';tags.appendChild(b)})</script></main></body></html>
