<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Where is Bunny?</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(145deg,#f9e7dc,#e4f2ea);font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#352d2a;overscroll-behavior:none}main{max-width:900px;margin:auto;padding:8px 10px 20px}.back{display:inline-block;color:#665853;text-decoration:none;font-weight:900;padding:8px 2px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(24px,7vw,38px);margin:3px 0 8px}.task{border:0;border-radius:14px;background:#fff;padding:11px 13px;font-weight:900;box-shadow:0 4px 12px #0001}.challenge{display:none;margin:6px 0 9px;padding:10px;border-radius:14px;background:#fff5bd;text-align:center;font-size:18px;font-weight:950}.scene{position:relative;height:min(58vh,500px);min-height:410px;border:4px solid #fff;border-radius:27px;overflow:hidden;background:linear-gradient(#bfe6f2 0 62%,#dcecc4 62%);box-shadow:0 12px 30px #0002;touch-action:none}.cloud{position:absolute;width:80px;height:26px;border-radius:99px;background:#ffffffb8;top:35px;left:20%}.cloud:after,.cloud:before{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:35px;height:35px;left:12px;top:-16px}.cloud:after{width:45px;height:45px;right:10px;top:-23px}.ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#dcecc4,#c8dda8)}.glass,.jar{position:absolute;top:46%;z-index:5;pointer-events:none}.glass{left:18%;width:92px;height:145px;border:6px solid #f9ffff;border-top-color:#fff;border-radius:8px 8px 22px 22px;background:linear-gradient(90deg,#ffffff30,#9edbea40,#ffffff38);box-shadow:inset 0 -10px 0 #80cce533,0 4px 8px #0001}.glass:before{content:"";position:absolute;left:-7px;right:-7px;top:-7px;height:12px;border:4px solid #fff;border-radius:50%;background:#bfe6f255}.jar{right:12%;width:112px;height:150px;border:6px solid #f8ffff;border-radius:28px 28px 22px 22px;background:linear-gradient(90deg,#ffffff25,#9edbea35,#ffffff45);box-shadow:inset 0 -8px 0 #80cce52b,0 4px 8px #0001}.jar:before{content:"";position:absolute;left:-4px;right:-4px;top:-18px;height:22px;border-radius:7px;background:repeating-linear-gradient(90deg,#c99232 0 5px,#e6b657 5px 9px);border:2px solid #a87525}.name{position:absolute;bottom:-28px;width:100%;text-align:center;font-size:13px;font-weight:900}.bunny{position:absolute;left:46%;top:45%;width:82px;height:105px;border:0;background:transparent;font-size:76px;line-height:1;z-index:9;touch-action:none;user-select:none;padding:0;cursor:grab;filter:drop-shadow(0 4px 2px #0002)}.card{margin-top:10px;background:#ffffffdd;border-radius:18px;padding:11px;text-align:center;box-shadow:0 4px 12px #0001}.en{font-size:22px;font-weight:950}.alt{font-size:15px;color:#7c3aed;font-weight:800}.ru{color:#71645f}.feedback{min-height:22px;font-weight:950}.words{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:9px}.words button{border:1px solid #0001;border-radius:11px;background:#ffffffcf;padding:8px 9px;font-weight:850;min-height:40px}.words button:active{transform:scale(.96)}@media(max-width:420px){.scene{min-height:400px}.glass{left:10%;width:80px;height:132px}.jar{right:7%;width:96px;height:138px}.bunny{font-size:68px;width:74px;height:95px}}</style></head><body><main><a class="back" href="../../">‹ All games</a><div class="head"><h1>🐰 Where is Bunny?</h1><button id="task" class="task">🎯 Task</button></div><div id="challenge" class="challenge"></div><div id="scene" class="scene"><div class="cloud"></div><div class="ground"></div><div id="glass" class="glass"><div class="name">glass</div></div><div id="jar" class="jar"><div class="name">jar</div></div><button id="bunny" class="bunny" aria-label="Bunny">🐰</button></div><div class="card"><div id="en" class="en">Move Bunny!</div><div id="alt" class="alt"></div><div id="ru" class="ru">Передвигай зайчика.</div><div id="feedback" class="feedback"></div></div><div class="words" id="words"></div></main><script>(()=>{const $=s=>document.querySelector(s),S=$('#scene'),B=$('#bunny'),G=$('#glass'),J=$('#jar'),EN=$('#en'),ALT=$('#alt'),RU=$('#ru'),F=$('#feedback'),C=$('#challenge');const P={in:'in',outside:'outside',on:'on',under:'under',above:'above',next:'next to',near:'near',far:'far from',behind:'behind',front:'in front of',between:'between',left:'to the left of',right:'to the right of'};const R={in:'внутри',outside:'снаружи',on:'на',under:'под',above:'над',next:'рядом с',near:'недалеко от',far:'далеко от',behind:'позади',front:'перед',between:'между',left:'слева от',right:'справа от'};let target=null,drag=false,dx=0,dy=0;function rect(el){let r=el.getBoundingClientRect(),s=S.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}}function objectName(o){return o===G?'glass':'jar'}function show(p,o){let n=o?objectName(o):'';if(p==='between'){EN.textContent='Bunny is BETWEEN the glass and the jar.';RU.textContent='Зайчик между стаканом и банкой.'}else{EN.textContent='Bunny is '+P[p].toUpperCase()+' the '+n+'.';RU.textContent='Зайчик '+R[p]+' '+(n==='glass'?'стакана.':'банки.')}ALT.textContent=p==='in'?'Also: Bunny is INSIDE the '+n+'.':p==='outside'?'Opposite: INSIDE the '+n+'.':'';if(target){let ok=p===target.p&&(!target.o||target.o===n);F.textContent=ok?'⭐ Great!':'';if(ok){target=null;C.style.display='none'}}}function relation(o,b){let q=rect(o),bx=b.x+b.w/2,by=b.y+b.h/2,ox=q.x+q.w/2,oy=q.y+q.h/2,overX=bx>q.x&&bx<q.x+q.w;if(overX&&by>q.y+22&&by<q.y+q.h-6)return'in';if(b.y+b.h<=q.y+18&&Math.abs(bx-ox)<q.w*.75)return'on';if(b.y>=q.y+q.h-8&&Math.abs(bx-ox)<q.w)return'under';if(b.y+b.h<q.y-15&&Math.abs(bx-ox)<q.w)return'above';if(overX&&Math.abs(by-oy)<q.h*.7)return b.style.zIndex<6?'behind':'front';return null}function classify(){let b=rect(B),g=rect(G),j=rect(J),bx=b.x+b.w/2,gx=g.x+g.w/2,jx=j.x+j.w/2,rg=relation(G,b),rj=relation(J,b);if(rg)return show(rg,G);if(rj)return show(rj,J);if(bx>g.x+g.w&&bx<j.x)return show('between');let dg=Math.abs(bx-gx),dj=Math.abs(bx-jx),o=dg<dj?G:J,d=Math.min(dg,dj),q=rect(o);if(d>q.w*2.4)return show('far',o);if(d<q.w*1.2)return show('next',o);if(d<q.w*1.9)return show('near',o);return show(bx<(q.x+q.w/2)?'left':'right',o)}function move(e){if(!drag)return;e.preventDefault();let s=S.getBoundingClientRect(),x=Math.max(0,Math.min(S.clientWidth-B.offsetWidth,e.clientX-s.left-dx)),y=Math.max(0,Math.min(S.clientHeight-B.offsetHeight,e.clientY-s.top-dy));B.style.left=x+'px';B.style.top=y+'px';let b=rect(B),objects=[G,J];let overlap=objects.some(o=>{let q=rect(o),cx=b.x+b.w/2,cy=b.y+b.h/2;return cx>q.x&&cx<q.x+q.w&&cy>q.y&&cy<q.y+q.h});if(overlap)B.style.zIndex=y<(S.clientHeight*.43)?'4':'9'}B.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;let r=B.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;B.setPointerCapture?.(e.pointerId)});B.addEventListener('pointermove',move);B.addEventListener('pointerup',e=>{drag=false;classify()});const choices=['in','outside','on','under','above','next','near','far','behind','front','between','left','right'];choices.forEach(p=>{let x=document.createElement('button');x.textContent=p==='in'?'IN / INSIDE':P[p].toUpperCase();x.onclick=()=>{target=null;C.style.display='none';if(p==='between'){let g=rect(G),j=rect(J);B.style.left=((g.x+g.w+j.x-B.offsetWidth)/2)+'px';B.style.top=(g.y+35)+'px';show('between');return}let o=Math.random()<.5?G:J,q=rect(o),x=q.x-B.offsetWidth-12,y=q.y+25;if(p==='in'){x=q.x+(q.w-B.offsetWidth)/2;y=q.y+45}else if(p==='on'){x=q.x+(q.w-B.offsetWidth)/2;y=q.y-B.offsetHeight+10}else if(p==='under'){x=q.x+(q.w-B.offsetWidth)/2;y=q.y+q.h+5}else if(p==='above'){x=q.x+(q.w-B.offsetWidth)/2;y=Math.max(3,q.y-B.offsetHeight-30)}else if(p==='outside'){x=q.x+q.w+18;y=q.y+20}else if(p==='next'){x=q.x-B.offsetWidth-8}else if(p==='near'){x=q.x-B.offsetWidth-45}else if(p==='far'){x=o===G?S.clientWidth-B.offsetWidth-4:4;y=15}else if(p==='behind'||p==='front'){x=q.x+(q.w-B.offsetWidth)/2;y=q.y+30;B.style.zIndex=p==='behind'?'4':'9'}else if(p==='left'){x=Math.max(3,q.x-B.offsetWidth-75)}else if(p==='right'){x=Math.min(S.clientWidth-B.offsetWidth-3,q.x+q.w+75)}B.style.left=x+'px';B.style.top=y+'px';show(p,o)};$('#words').appendChild(x)});$('#task').onclick=()=>{let p=choices[Math.floor(Math.random()*choices.length)],o=null,n='';if(p!=='between'){o=Math.random()<.5?'glass':'jar';n=' the '+o}target={p,o};C.style.display='block';C.textContent='Put Bunny '+(p==='in'?'IN / INSIDE':P[p].toUpperCase())+(p==='between'?' the glass and the jar':n)+'!';F.textContent=''};})();</script></body></html>
